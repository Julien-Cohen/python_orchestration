name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    container: python:3.12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run tests
        run: python -m pytest -v
