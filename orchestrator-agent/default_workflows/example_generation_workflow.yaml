$schema: "../or_lang_ast/workflow_schema.yaml"

type: workflow
internalChannels: []
inputChannels:
  - type: input-channel-declaration
    name: prompt
    structure: Atom
    init_with_part: "no-value"
outputChannels:
  - type: channel-declaration
    name: final-result
    structure: Atom
    init_with_value:  "no-value"
body:
  type: sequence

  step1:
    type: generation-step
    task:
      config:
        skill: Generate something.
        nbSpawns: 1
        nbDifferentAgents: 1
        nbRequiredAnswers: 1
        agentTimeout: 30000
        onAgentFailure: RetryOther
        onAgentRejection: NoRetry
        maxEffort: 1000
        maxRetry: 2
      solutionJoin: First
      inputChannels:
        - prompt
      feedbackChannels: []
      outputChannels:
        - final-result

  step2:
    type: reply-step
    outputChannels:
      - final-result