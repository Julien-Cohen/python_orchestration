[project]
name = "mosaico-wof"
version = "0.0.1"
description = "Lexer, parser and Pydantic AST for a small SysML v2-like workflow language"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "pytest>=9.2.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[project.scripts]
wof = "wof.__main__:main"

