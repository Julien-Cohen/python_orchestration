[project]
name = "mosaico-orchestrator"
version = "2.0.1"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "PyYAML",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]