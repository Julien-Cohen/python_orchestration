[project]
name = "mosaico-orchestrator"
version = "2.0.1"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "PyYAML",
    "a2a-sdk[http-server, grpc]>=1.0.0,<1.1.0",
    "grpcio",
    "uvicorn",
    "fastapi"
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]