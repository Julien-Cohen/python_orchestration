$schema: "../or_lang_ast/workflow_schema.yaml"

type: workflow
internalChannels:
  - type: channel-declaration
    name: first-result
    structure: Atom
    init_with_value: "true"
inputChannels:
  - type: input-channel-declaration
    name: final-result
    structure: Atom
    init_with_part: "test"
outputChannels: []
body:
  type: sequence
  step1:
    # first do something
    type: reply-step
    outputChannels:
      - first-result
  step2:
    # then do something else
    type: reply-step
    outputChannels:
      - final-result