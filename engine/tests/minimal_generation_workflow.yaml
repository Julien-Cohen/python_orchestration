$schema: "../orchestrator/yaml_schema/workflow_schema.yaml"

type: workflow
internalChannels:
  - type: channel-declaration
    name: final-result
    structure: Atom
    init_with_value: "no-value"
inputChannels:
  - type: input-channel-declaration
    name: spec
    structure: Atom
    init_with_part: "spec"
outputChannels: []
body:
  type: generation-step
  task:
    config:
      skill: Generate something.
      override_repo: "http://127.0.0.1:9010"
      nbSpawns: 1
      nbDifferentAgents: 1
      nbRequiredAnswers: 1
      agentTimeout: 30000
      onAgentFailure: RetryOther
      onAgentRejection: NoRetry
      maxEffort: 1000
      maxRetry: 2
    solutionJoin: First
    inputChannels:
      - spec
    feedbackChannels: []
    outputChannels:
      - final-result